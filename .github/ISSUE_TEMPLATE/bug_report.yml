name: Bug report
description: whoson printed the wrong thing, or nothing at all
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        whoson reads common storage and the process table, so the most useful
        thing you can attach is the output of `ps -A -o pid,xasid` and, for a
        TSO/E row, what `D TS,A` says about that address space.

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the whoson output, and the `ps`/`D TS,A`
        output it disagrees with.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: whoson --version
      placeholder: whoson 1.1.0
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: z/OS release and Open XL level
      description: The `uname -a` output, and the compiler level
        (`ibm-clang --version`).
      placeholder: z/OS 3.1, Open XL 2.2.0
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: How it was built
      options:
        - make install, from a release tag
        - make, from a git checkout
        - something else (say so above)
    validations:
      required: true
